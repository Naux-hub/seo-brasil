name: Weekly SEO Report — Mexico

on:
  schedule:
    - cron: "0 7 * * 1"  # Varje måndag kl 07:00 UTC (08:00 svensk tid)
  workflow_dispatch:       # Tillåter manuell körning via GitHub UI

jobs:
  run-report-mx:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install supabase requests python-dotenv

      - name: Run rank tracker (Mexico)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          MARKET: mx
        run: python rank_tracker.py
